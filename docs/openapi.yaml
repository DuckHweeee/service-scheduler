components:
  schemas:
    Problem:
      additionalProperties: false
      properties:
        alternatives:
          items:
            additionalProperties: false
            properties:
              date:
                pattern: ^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$
                type: string
              endTime:
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
                type: string
              startAt:
                format: date-time
                pattern: ^(?:(?:\d\d[2468][048]|\d\d[13579][26]|\d\d0[48]|[02468][048]00|[13579][26]00)-02-29|\d{4}-(?:(?:0[13578]|1[02])-(?:0[1-9]|[12]\d|3[01])|(?:0[469]|11)-(?:0[1-9]|[12]\d|30)|(?:02)-(?:0[1-9]|1\d|2[0-8])))T(?:(?:[01]\d|2[0-3]):[0-5]\d:[0-5]\d(?:\.\d+)?(?:Z|([+-](?:[01]\d|2[0-3]):[0-5]\d)))$
                type: string
              startTime:
                pattern: ^([01]\d|2[0-3]):[0-5]\d$
                type: string
            required:
              - date
              - startTime
              - endTime
              - startAt
            type: object
          maxItems: 5
          type: array
        code:
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - INTERNAL_ERROR
            - SLOT_UNAVAILABLE
            - VEHICLE_ALREADY_BOOKED
            - PARTS_UNAVAILABLE
            - OUTSIDE_BOOKING_HORIZON
            - OUTSIDE_OPENING_HOURS
            - DEALERSHIP_CLOSED
            - MISALIGNED_START
            - VEHICLE_NOT_OWNED
            - SERVICE_NOT_APPLICABLE
            - SERVICE_NOT_EXPRESS
            - LEAD_TIME_NOT_MET
            - APPOINTMENT_NOT_CANCELLABLE
            - APPOINTMENT_NOT_ACTIVE
            - LATE_ARRIVAL
            - STOCK_BELOW_RESERVED
            - IDEMPOTENCY_KEY_REUSED
          type: string
        detail:
          type: string
        errors:
          items:
            additionalProperties: false
            properties:
              message:
                type: string
              path:
                type: string
            required:
              - path
              - message
            type: object
          type: array
        reason:
          enum:
            - AVAILABLE
            - NO_QUALIFIED_TECHNICIAN
            - NO_BAY
            - FULLY_BOOKED
            - SAME_DAY_QUOTA_REACHED
          type: string
        status:
          maximum: 9007199254740991
          minimum: -9007199254740991
          type: integer
        title:
          type: string
        type:
          type: string
      required:
        - type
        - title
        - status
        - code
        - detail
      type: object
info:
  description: "Service-appointment booking API. A time is confirmed only when a service bay and a qualified technician are both free for the whole job. Double-booking is prevented twice: bookings for a dealership-day are serialised with a Postgres advisory lock and re-checked inside the transaction, and an exclusion constraint on bay and technician time ranges (confirmed appointments only) rejects any overlap that slips through, returning 409 SLOT_UNAVAILABLE with alternatives. Same-day booking is restricted to express services, needs a minimum lead time, is capped by a daily quota, and reserves parts atomically (409 PARTS_UNAVAILABLE when stock is short); a same-day customer who arrives later than the grace period is marked NO_SHOW and their resources are released. All errors are RFC 7807 application/problem+json."
  title: Unified Service Scheduler API
  version: 0.1.0
openapi: 3.0.3
