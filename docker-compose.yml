# Optional for reviewers with Docker. Local dev without Docker: `pnpm db:up` (embedded-postgres, same port/credentials).
services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: scheduler
    ports: ["54329:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 30
  jaeger:
    profiles: [obs]
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]
volumes:
  pgdata:
